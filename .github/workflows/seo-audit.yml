name: ScaleaStay SEO Audit V2

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public site URL to audit
        required: false
        default: https://scaleastay.com
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/seo-audit.mjs
      - scripts/seo-audit-v2.1.mjs
      - scripts/seo-agent-report.mjs
      - scripts/seo-audit-sheet-sync.mjs
      - .github/workflows/seo-audit.yml
  push:
    branches:
      - scaleastay-growth-v1
    paths:
      - scripts/seo-audit.mjs
      - scripts/seo-audit-v2.1.mjs
      - scripts/seo-agent-report.mjs
      - scripts/seo-audit-sheet-sync.mjs
      - .github/workflows/seo-audit.yml
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: scaleastay-seo-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Rendered DOM audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ inputs.base_url || 'https://scaleastay.com' }}
      CANONICAL_ORIGIN: https://scaleastay.com
      PREVIEW_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--scaleastay.netlify.app', github.event.pull_request.number) || 'https://deploy-preview-2--scaleastay.netlify.app' }}
      SCALEASTAY_SEO_SHEET_ID: 10_VRSzVtYjipud-1c4bbOTdysGz-SuqqWhggpMwvu_M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Run primary read-only SEO audit
        run: node scripts/seo-audit-v2.1.mjs --base-url "$BASE_URL" --canonical-origin "$CANONICAL_ORIGIN" --output-dir artifacts/primary

      - name: Wait for Deploy Preview
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/scaleastay-growth-v1'
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 12 \
            "$PREVIEW_URL/" > /dev/null

      - name: Run Deploy Preview read-only SEO audit
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/scaleastay-growth-v1'
        run: node scripts/seo-audit-v2.1.mjs --base-url "$PREVIEW_URL" --canonical-origin "$CANONICAL_ORIGIN" --output-dir artifacts/preview

      - name: Build plain-language SEO agent report
        shell: bash
        run: |
          args=(
            --production-report artifacts/primary/seo-audit.json
            --output-dir artifacts/agent
          )
          if [ -f artifacts/preview/seo-audit.json ]; then
            args+=(--preview-report artifacts/preview/seo-audit.json)
          fi
          node scripts/seo-agent-report.mjs "${args[@]}"

      - name: Check Google Sheets credential
        id: sheets
        if: github.event_name != 'pull_request'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Google Sheets credential: PRESENT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON is missing; audit reports were generated but not written to Google Sheets."
          fi

      - name: Record primary audit in Google Sheets
        if: github.event_name != 'pull_request' && steps.sheets.outputs.available == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/seo-audit-sheet-sync.mjs \
            --report artifacts/primary/seo-audit.json \
            --environment production \
            --spreadsheet-id "$SCALEASTAY_SEO_SHEET_ID"

      - name: Record Deploy Preview audit in Google Sheets
        if: github.event_name != 'pull_request' && steps.sheets.outputs.available == 'true' && github.ref == 'refs/heads/scaleastay-growth-v1'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/seo-audit-sheet-sync.mjs \
            --report artifacts/preview/seo-audit.json \
            --environment preview \
            --spreadsheet-id "$SCALEASTAY_SEO_SHEET_ID"

      - name: Record plain-language agent report in Google Sheets
        if: github.event_name != 'pull_request' && steps.sheets.outputs.available == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/seo-audit-sheet-sync.mjs \
            --agent-report artifacts/agent/seo-agent-report.json \
            --spreadsheet-id "$SCALEASTAY_SEO_SHEET_ID"

      - name: Add owner report to job summary
        if: always()
        run: |
          if [ -f artifacts/agent/seo-agent-report.md ]; then
            cat artifacts/agent/seo-agent-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Plain-language SEO agent report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "## Technical evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Full JSON and Markdown audit evidence is attached to this workflow run as an artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: scaleastay-seo-audit-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
