name: SEO Sheet Secret Probe

on:
  push:
    branches:
      - scaleastay-seo-sheet-stage
    paths:
      - .github/workflows/seo-sheet-secret-probe.yml

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Publish credential status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            state="success"
            description="GOOGLE_SERVICE_ACCOUNT_JSON is present"
          else
            state="failure"
            description="GOOGLE_SERVICE_ACCOUNT_JSON is missing"
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(printf '{\"state\":\"%s\",\"context\":\"scaleastay/seo-sheet-credential\",\"description\":\"%s\"}' "$state" "$description")"
