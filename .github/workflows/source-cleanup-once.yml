name: One-time source content cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - scaleastay-growth-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.head_ref == 'scaleastay-source-cleanup-stage-v1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: scaleastay-source-cleanup-stage-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply and validate source cleanup
        run: node scripts/source-cleanup-once.mjs

      - name: Remove one-time migration files
        run: |
          rm scripts/source-cleanup-once.mjs
          rm .github/workflows/source-cleanup-once.yml

      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: remove stale location claims [source-cleanup] [skip ci]"
          git push origin HEAD:scaleastay-source-cleanup-stage-v1
