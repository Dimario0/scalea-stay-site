[build]
  command = "npm run build"
  publish = "dist"

# Explicit rewrites for generated static HTML. These rules make direct requests
# to language roots and SEO/GEO landing pages resolve to their real index.html
# files in Deploy Preview instead of depending on directory shadowing behavior.

[[redirects]]
  from = "/ru"
  to = "/ru/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/ru/"
  to = "/ru/index.html"
  status = 200
  force = true

